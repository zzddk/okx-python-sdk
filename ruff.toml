# Lint gate for the package. `test/` is outside this gate for now.
# Keep the ruff version in sync with dev_requirements.txt and the CI lint job.
target-version = "py37"

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[lint.per-file-ignores]
# These modules import endpoint constants with `from .consts import *`.
# pyflakes cannot resolve those names, so F403/F405 would flag every use; the
# contract test invokes every method, which catches a mistyped constant.
"okx/Account.py" = ["F403", "F405"]
"okx/BlockTrading.py" = ["F403", "F405"]
"okx/Convert.py" = ["F403", "F405"]
"okx/CopyTrading.py" = ["F403", "F405"]
"okx/FDBroker.py" = ["F403", "F405"]
"okx/Finance/EthStaking.py" = ["F403", "F405"]
"okx/Finance/FlexibleLoan.py" = ["F403", "F405"]
"okx/Finance/Savings.py" = ["F403", "F405"]
"okx/Finance/SolStaking.py" = ["F403", "F405"]
"okx/Finance/StakingDefi.py" = ["F403", "F405"]
"okx/Funding.py" = ["F403", "F405"]
"okx/Grid.py" = ["F403", "F405"]
"okx/MarketData.py" = ["F403", "F405"]
"okx/PublicData.py" = ["F403", "F405"]
"okx/SpreadTrading.py" = ["F403", "F405"]
"okx/Status.py" = ["F403", "F405"]
"okx/SubAccount.py" = ["F403", "F405"]
"okx/Trade.py" = ["F403", "F405"]
"okx/TradingData.py" = ["F403", "F405"]
