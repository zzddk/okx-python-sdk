# Lint gate for the package. `test/` is outside this gate for now.
# Keep the ruff version in sync with dev_requirements.txt and the CI lint job.
target-version = "py37"

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[lint.per-file-ignores]
# These modules import endpoint constants with `from .consts import *`.
# pyflakes cannot resolve those names, so F403/F405 would flag every use; the
# contract test invokes every method, which catches a mistyped constant.
"okxsdk/Account.py" = ["F403", "F405"]
"okxsdk/BlockTrading.py" = ["F403", "F405"]
"okxsdk/Convert.py" = ["F403", "F405"]
"okxsdk/CopyTrading.py" = ["F403", "F405"]
"okxsdk/FDBroker.py" = ["F403", "F405"]
"okxsdk/Finance/EthStaking.py" = ["F403", "F405"]
"okxsdk/Finance/FlexibleLoan.py" = ["F403", "F405"]
"okxsdk/Finance/Savings.py" = ["F403", "F405"]
"okxsdk/Finance/SolStaking.py" = ["F403", "F405"]
"okxsdk/Finance/StakingDefi.py" = ["F403", "F405"]
"okxsdk/Funding.py" = ["F403", "F405"]
"okxsdk/Grid.py" = ["F403", "F405"]
"okxsdk/MarketData.py" = ["F403", "F405"]
"okxsdk/PublicData.py" = ["F403", "F405"]
"okxsdk/SpreadTrading.py" = ["F403", "F405"]
"okxsdk/Status.py" = ["F403", "F405"]
"okxsdk/SubAccount.py" = ["F403", "F405"]
"okxsdk/Trade.py" = ["F403", "F405"]
"okxsdk/TradingData.py" = ["F403", "F405"]
